[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xmm-cluster-pipeline"
version = "0.1.0"
description = "XMM-Newton cluster spectroscopy: reproducing published temperatures and learning initial fit models"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Daocheng Wu" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]
spectra = ["astropy>=5"]

[tool.setuptools.packages.find]
include = ["xmmcluster*", "demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
